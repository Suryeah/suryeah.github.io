<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Surya Portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect all 404s back to index.html with the path encoded as a query param
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=' +
        encodeURIComponent(l.pathname + l.search) +
        (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
      );
    </script>
  </head>
  <body></body>
</html>
